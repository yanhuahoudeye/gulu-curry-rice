<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 咕噜咖喱饭</title>
<style>
  :root {
    --orange: #e67e22;
    --orange-dark: #d35400;
    --brown: #3C1F0E;
    --bg: #faf8f5;
    --card: #fff;
    --border: #eee;
    --text: #333;
    --text-light: #999;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Top Nav ── */
  .top-nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 40px;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 16px rgba(0,0,0,0.04);
  }

  .nav-brand {
    font-size: 20px; font-weight: 700; color: var(--brown);
    text-decoration: none; letter-spacing: 1px;
  }
  .nav-brand span { color: var(--orange); }

  .nav-links { display: flex; gap: 24px; align-items: center; }
  .nav-links a {
    text-decoration: none; font-size: 14px; color: #666;
    font-weight: 500; transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--orange); }

  .logout-btn {
    padding: 7px 18px; border-radius: 20px; border: 1.5px solid #e0e0e0;
    background: #fff; font-size: 13px; cursor: pointer;
    transition: all 0.2s; color: #888;
  }
  .logout-btn:hover { border-color: #e74c3c; color: #e74c3c; }

  /* ── Layout ── */
  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; display: flex; gap: 28px; flex-wrap: wrap; }

  /* ── Sidebar ── */
  .sidebar { flex: 0 0 260px; }
  .sidebar-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 32px 24px; text-align: center;
    position: sticky; top: 90px;
  }

  .avatar-wrap {
    position: relative; width: 100px; height: 100px; margin: 0 auto 16px;
    cursor: pointer;
  }
  .avatar-img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--orange);
  }
  .avatar-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 50%; background: rgba(0,0,0,0.4); display: flex;
    align-items: center; justify-content: center; opacity: 0;
    transition: opacity 0.2s; color: #fff; font-size: 13px;
  }
  .avatar-wrap:hover .avatar-overlay { opacity: 1; }

  .sidebar-nickname { font-size: 18px; font-weight: 600; color: var(--brown); margin-bottom: 4px; }
  .sidebar-phone { font-size: 13px; color: var(--text-light); margin-bottom: 16px; }

  .sidebar-menu { text-align: left; }
  .sidebar-menu a {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px; font-size: 14px;
    color: #666; text-decoration: none; transition: all 0.2s;
    margin-bottom: 4px;
  }
  .sidebar-menu a.active, .sidebar-menu a:hover {
    background: #fff8f0; color: var(--orange); font-weight: 500;
  }

  /* ── Main ── */
  .main { flex: 1; min-width: 0; }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 20px;
  }
  .card-title {
    font-size: 18px; font-weight: 600; color: var(--brown);
    margin-bottom: 20px; padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }

  /* ── Form ── */
  .form-row { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .form-row:last-child { margin-bottom: 0; }
  .form-group { flex: 1; min-width: 200px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 500;
    color: #888; margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0;
    border-radius: var(--radius-sm); font-size: 15px;
    font-family: inherit; outline: none; transition: border 0.2s;
    background: #fafafa;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--orange); background: #fff;
    box-shadow: 0 0 0 3px rgba(230,126,34,0.08);
  }
  .form-group input:disabled {
    background: #f5f5f5; color: #999; cursor: not-allowed;
  }

  .btn {
    padding: 10px 28px; border: none; border-radius: 24px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: all 0.25s; font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: #fff;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(230,126,34,0.3); }
  .btn-outline {
    background: #fff; border: 1.5px solid #d0d0d0; color: #666;
  }
  .btn-outline:hover { border-color: var(--orange); color: var(--orange); }

  .btn-sm { padding: 6px 16px; font-size: 13px; }

  /* ── Toast ── */
  .toast {
    position: fixed; top: 24px; right: 24px; z-index: 999;
    padding: 14px 24px; border-radius: 12px; font-size: 14px;
    color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    transform: translateX(120%); transition: transform 0.35s ease;
    max-width: 400px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { background: linear-gradient(135deg, #27ae60, #2ecc71); }
  .toast.error { background: linear-gradient(135deg, #c0392b, #e74c3c); }

  /* ── Orders Placeholder ── */
  .empty-state {
    text-align: center; padding: 40px 20px; color: #ccc;
  }
  .empty-state .icon { font-size: 56px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; color: #aaa; }

  /* Mobile */
  @media (max-width: 768px) {
    .container { flex-direction: column; }
    .sidebar { flex: auto; }
    .sidebar-card { position: static; }
  }
</style>
</head>
<body>

<!-- ═══ Top Nav ═══ -->
<nav class="top-nav">
  <a href="/gulu/" class="nav-brand">🍛 咕噜<span>咖喱饭</span></a>
  <div class="nav-links">
    <a href="/gulu/">🏠 首页</a>
    <a href="/gulu/profile.html" style="color:var(--orange)">👤 个人中心</a>
    <button class="logout-btn" onclick="doLogout()">退出登录</button>
  </div>
</nav>

<!-- ═══ Toast ═══ -->
<div class="toast" id="toast"></div>

<div class="container">

  <!-- ═══ Sidebar ═══ -->
  <aside class="sidebar">
    <div class="sidebar-card">
      <div class="avatar-wrap" onclick="document.getElementById('avatarInput').click()">
        <img class="avatar-img" id="avatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='35' r='25' fill='%23ddd'/%3E%3Cellipse cx='50' cy='85' rx='38' ry='20' fill='%23ddd'/%3E%3C/svg%3E">
        <div class="avatar-overlay">📷 换头像</div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this.files[0])">
      <div class="sidebar-nickname" id="sidebarName">---</div>
      <div class="sidebar-phone" id="sidebarPhone">---</div>
      <div class="sidebar-menu">
        <a href="#info" class="active" onclick="switchTab('info')">📋 个人信息</a>
        <a href="#password" onclick="switchTab('password')">🔒 修改密码</a>
        <a href="#orders" onclick="switchTab('orders')">📦 我的订单</a>
      </div>
    </div>
  </aside>

  <!-- ═══ Main ═══ -->
  <main class="main">

    <!-- 个人信息 -->
    <section class="card" id="tab-info">
      <div class="card-title">📋 个人信息</div>
      <form onsubmit="saveProfile(event)">
        <div class="form-row">
          <div class="form-group">
            <label>昵称</label>
            <input type="text" id="nickname" required>
          </div>
          <div class="form-group">
            <label>手机号（不可修改）</label>
            <input type="tel" id="phone" disabled>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="email" placeholder="填写邮箱接收订单通知">
          </div>
          <div class="form-group">
            <label>性别</label>
            <select id="gender">
              <option value="">不设置</option>
              <option value="male">男</option>
              <option value="female">女</option>
              <option value="other">其他</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>生日</label>
            <input type="date" id="birthday">
          </div>
          <div class="form-group">
            <label>注册时间</label>
            <input type="text" id="createdAt" disabled>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">💾 保存修改</button>
      </form>
    </section>

    <!-- 修改密码 -->
    <section class="card" id="tab-password" style="display:none">
      <div class="card-title">🔒 修改密码</div>
      <form onsubmit="changePassword(event)">
        <div class="form-row">
          <div class="form-group">
            <label>当前密码</label>
            <input type="password" id="oldPw" required placeholder="输入当前密码">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>新密码</label>
            <input type="password" id="newPw" required placeholder="至少6位" minlength="6">
          </div>
          <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="newPw2" required placeholder="再次输入新密码" minlength="6">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">🔐 修改密码</button>
      </form>
    </section>

    <!-- 我的订单 -->
    <section class="card" id="tab-orders" style="display:none">
      <div class="card-title">📦 我的订单</div>
      <div class="empty-state">
        <div class="icon">🍛</div>
        <p>还没有订单，快去点一份咖喱饭吧！</p>
        <p style="font-size:13px;margin-top:6px">订单功能即将上线，敬请期待～</p>
      </div>
    </section>
  </main>
</div>

<!-- ═══ Script ═══ -->
<script>
  const API = '/gulu/api';
  let token = localStorage.getItem('gulu_token');

  // ── 初始化 ──
  (async function init() {
    if (!token) { location.href = '/gulu/'; return; }
    await loadProfile();
  })();

  async function loadProfile() {
    try {
      const res = await fetch(`${API}/user/profile`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const json = await res.json();
      if (json.code !== 0) { clearToken(); return; }

      const u = json.data;
      document.getElementById('nickname').value = u.nickname || '';
      document.getElementById('phone').value = u.phone || '';
      document.getElementById('email').value = u.email || '';
      document.getElementById('gender').value = u.gender || '';
      document.getElementById('birthday').value = u.birthday || '';
      document.getElementById('createdAt').value = u.created_at || '';

      document.getElementById('sidebarName').textContent = u.nickname || '---';
      document.getElementById('sidebarPhone').textContent = u.phone || '---';

      if (u.avatar) {
        document.getElementById('avatarImg').src = u.avatar;
      }
    } catch (e) {
      showToast('网络错误，请刷新重试', 'error');
    }
  }

  // ── 保存个人信息 ──
  async function saveProfile(e) {
    e.preventDefault();
    const data = {
      nickname: document.getElementById('nickname').value.trim(),
      email: document.getElementById('email').value.trim(),
      gender: document.getElementById('gender').value,
      birthday: document.getElementById('birthday').value
    };

    try {
      const res = await fetch(`${API}/user/profile`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (json.code === 0) {
        showToast('✅ 个人信息已更新', 'success');
        loadProfile();
      } else {
        showToast(json.msg, 'error');
      }
    } catch (e) {
      showToast('网络错误', 'error');
    }
  }

  // ── 上传头像 ──
  async function uploadAvatar(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('文件不能超过 5MB', 'error'); return; }

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch(`${API}/user/avatar`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
      });
      const json = await res.json();
      if (json.code === 0) {
        document.getElementById('avatarImg').src = json.data.avatar + '?t=' + Date.now();
        showToast('✅ 头像已更新', 'success');
      } else {
        showToast(json.msg, 'error');
      }
    } catch (e) {
      showToast('上传失败', 'error');
    }
  }

  // ── 修改密码 ──
  async function changePassword(e) {
    e.preventDefault();
    const oldPw = document.getElementById('oldPw').value;
    const newPw = document.getElementById('newPw').value;
    const newPw2 = document.getElementById('newPw2').value;

    if (newPw !== newPw2) { showToast('两次新密码不一致', 'error'); return; }

    try {
      const res = await fetch(`${API}/user/password`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ old_password: oldPw, new_password: newPw })
      });
      const json = await res.json();
      if (json.code === 0) {
        showToast('✅ 密码已修改，请重新登录', 'success');
        setTimeout(() => { clearToken(); location.href = '/gulu/'; }, 1500);
      } else {
        showToast(json.msg, 'error');
      }
    } catch (e) {
      showToast('网络错误', 'error');
    }
  }

  // ── 退出 ──
  function doLogout() {
    clearToken();
    location.href = '/gulu/';
  }

  function clearToken() {
    localStorage.removeItem('gulu_token');
    localStorage.removeItem('gulu_user');
    token = null;
  }

  // ── Tab 切换 ──
  function switchTab(name) {
    ['info','password','orders'].forEach(t => {
      document.getElementById(`tab-${t}`).style.display = t === name ? '' : 'none';
    });
    document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
    event.target.closest('a').classList.add('active');
  }

  // ── Toast ──
  function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `toast ${type} show`;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
