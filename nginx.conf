user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        server_name xjp.shizhige.win;

        ssl_certificate /root/cert/xjp.shizhige.win/fullchain.pem;
        ssl_certificate_key /root/cert/xjp.shizhige.win/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # 咕噜咖喱饭 - 静态网站
        location = /gulu {
            return 301 /gulu/;
        }

        # 咕噜咖喱饭 API（代理到 Flask 后端）
        location /gulu/api/ {
            proxy_pass http://127.0.0.1:25036/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 5m;
        }

        # 咕噜咖喱饭 - 静态文件
        location /gulu/ {
            alias /gulu/;
            index index.html;
            try_files $uri $uri/ =404;

            location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # 主站
        location / {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
            proxy_pass http://127.0.0.1:5678;
            client_max_body_size 20000m;
        }

        # alist
        location /alist/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
            proxy_pass http://127.0.0.1:5244/;
            client_max_body_size 20000m;
        }

        # michael - x-ui panel (x-ui has SSL enabled, proxy via HTTPS)
        location /michael/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
            proxy_pass https://127.0.0.1:9999;
            proxy_ssl_verify off;
            proxy_ssl_server_name off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # chatgpt
        location /chatgpt/ {
            proxy_pass http://127.0.0.1:7860/;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_max_temp_file_size 0;
            client_max_body_size 10m;
            client_body_buffer_size 128k;
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
        }
    }

    # 80 转 443
    server {
        listen 80;
        server_name xjp.shizhige.win;

        location /.well-known/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

}
